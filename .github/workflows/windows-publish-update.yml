name: Windows update feed

# When a QC Buddy release is published (not while it's a draft), copy its
# latest-windows.json to the permanent qcbuddy-latest release. Installed
# copies read qcbuddy-latest/latest-{{target}}.json, so this is the moment
# the update goes out. Run it by hand with an older tag to roll back.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release whose feed to serve, e.g. qcbuddy-v0.1.2"
        required: true

permissions:
  contents: write

jobs:
  feed:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'qcbuddy-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Get this release's feed
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern 'latest-*.json' --dir feed
          ls feed
          jq -e '.version and .platforms["windows-x86_64"].signature and .platforms["windows-x86_64"].url' feed/latest-windows.json
      - name: Serve it from qcbuddy-latest
        run: |
          if ! gh release view qcbuddy-latest --repo "$REPO" >/dev/null 2>&1; then
            # A pre-release, never "Latest", so the macOS app's latest release is untouched.
            gh release create qcbuddy-latest --repo "$REPO" --prerelease --latest=false \
              --title "QC Buddy update feed" \
              --notes "Update feed read by installed copies of QC Buddy (latest-{target}.json). Don't delete; download QC Buddy from the qcbuddy-v* releases."
          fi
          gh release upload qcbuddy-latest feed/latest-*.json --repo "$REPO" --clobber
          echo "Serving $TAG: $(jq -r .version feed/latest-windows.json)"

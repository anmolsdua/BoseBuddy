name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make build
      - name: Package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: BoseBuddy
          path: dist/release/

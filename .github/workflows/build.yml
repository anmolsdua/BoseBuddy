name: Build

# Pull requests only (and by hand); pushes don't build.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make build
      - name: Package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: BoseBuddy
          path: dist/release/

name: Windows

# Pull requests only (and by hand); pushes don't build.
on:
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml", ".github/workflows/windows-release.yml"]
  workflow_dispatch:

env:
  # No debug symbols in CI builds: smaller, faster to link (no huge .pdb
  # files), and smaller caches. Tests and panics still report file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  core:
    # Runners have no Bluetooth: this builds and runs the unit tests, which use
    # the simulated headset. Hardware checks happen on the Windows test PC.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/core
          # rust-cache keys only on the toolchain and lockfiles, and doesn't
          # save again on an exact hit. Without the workflows in the key, a
          # cache saved by older steps (the first app run saved clippy-only
          # metadata) is restored forever while every run rebuilds everything.
          key: ${{ hashFiles('.github/workflows/windows.yml', '.github/workflows/windows-release.yml') }}
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: CLI smoke test (simulated headset)
        run: cargo run --quiet --bin qcbuddy -- --fake status

  app:
    # UI tests (render from core/src/ui_fixtures.rs fixtures), type check,
    # and the Tauri app's build and tests (no installer).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/app/src-tauri
          key: ${{ hashFiles('.github/workflows/windows.yml', '.github/workflows/windows-release.yml') }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test
        working-directory: windows/app/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: windows/app/src-tauri

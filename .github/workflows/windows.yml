name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  core:
    # Runners have no Bluetooth: this builds and runs the unit tests, which use
    # the simulated headset. Hardware checks happen on the Windows test PC.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/core
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: CLI smoke test (simulated headset)
        run: cargo run --quiet --bin qcbuddy -- --fake status

  app:
    # Type-checks the flyout UI and builds the Tauri app (no installer).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/app/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo clippy -- -D warnings
        working-directory: windows/app/src-tauri
